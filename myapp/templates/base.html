<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        Noctem Learning Django
      {% endblock %}
    </title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"  rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <a class="navbar-brand" href="#">Noctem Learning Django</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          
          <li class="nav-item active">
            <a class="nav-link" href="{% url 'home' %}">Home</a>
          <li class="nav-item">
            <a class="nav-link" href="#">About</a>
          <li class="nav-item">
            <a class="nav-link" href="#">Contact</a>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'todos' %}">Todos</a>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'misc' %}">Misc</a>

          </li>
        </ul>
      </div>
    </nav>
    <div class="container">{% block content %} {% endblock %}</div>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.bundle.min.js" ></script>
  </body>

  <style>
    /* Styling the todo list */
    .todo-list {
        list-style-type: none; /* Remove bullets from the list */
        padding: 0;           /* Remove default padding */
        margin: 0;            /* Remove default margin */
    }

    .todo-list li {
        display: flex;          /* Use flexbox for layout */
        justify-content: space-between; /* Space out the title and status */
        align-items: center;    /* Align items vertically */
        padding: 10px 0;        /* Add spacing between list items */
        border-bottom: 1px solid #ddd; /* Optional: Add a dividing line */
    }

    .todo-title {
        flex: 1;                /* Allow the title to take up available space */
        margin-right: 20px;     /* Add space between the title and status */
    }

    .todo-status {
        white-space: nowrap;    /* Prevent the status from wrapping */
        font-weight: bold;      /* Optional: Make the status bold */
    }
</style>


</html>
